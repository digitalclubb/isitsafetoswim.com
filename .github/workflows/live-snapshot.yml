name: Refresh live snapshot

# Snapshots profile and rainfall for every bathing water and uploads it to
# Vercel Blob. environment.data.gov.uk 403s Vercel's egress IPs (and Vercel Cron
# runs on those same IPs), so this has to run on GitHub's runners, which the
# regulator host serves normally.

on:
  schedule:
    - cron: '17 * * * *' # hourly at :17
  workflow_dispatch:

# A slow regulator run should never stack on top of the next tick.
concurrency:
  group: live-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Probe regulator reachability
        run: |
          echo "runner public IP: $(curl -s --max-time 10 https://api.ipify.org)"
          echo -n "EA bulk list status: "
          curl -s -o /dev/null -w '%{http_code}\n' --max-time 20 \
            -A 'isitsafetoswim/0.1 (+https://isitsafetoswim.com)' \
            'https://environment.data.gov.uk/doc/bathing-water.json?_pageSize=1'
      - run: pnpm data:snapshot
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
