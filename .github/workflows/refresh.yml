name: Weekly rebuild

# Bathing-water classifications are republished about once a year, and the
# area pages (cleanest beaches per region) are derived from them. A weekly
# rebuild re-runs the production build and deploys it so the catalogue and
# every derived page stay current with no manual effort. Trigger it by hand
# from the Actions tab whenever a fresh deploy is wanted.
#
# GitHub's runners are in the US, which environment.data.gov.uk 403s, so
# England and Wales come from scripts/.locations.cache.json here. A
# `pnpm run deploy` from a UK machine refreshes those too.
on:
  schedule:
    - cron: '0 6 * * 1' # 06:00 UTC every Monday
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
